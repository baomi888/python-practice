<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baomi Agent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { brand: { 50:'#fdf2f8',100:'#fce7f3',200:'#fbcfe8',300:'#f9a8d4',400:'#f472b6',500:'#ec4899',600:'#db2777',700:'#be185d' } } } },
    };
  </script>
  <style>
    html,body{height:100%;margin:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:#f4f5f9;color:#1f2937}
    html.dark body{background:#0f1019;color:#e2e8f0}

    /* ====== 侧边栏 ====== */
    .sidebar{width:260px;min-width:260px;height:100vh;background:#ffffff;border-right:1px solid #e5e7eb;display:flex;flex-direction:column;padding:18px 12px;gap:6px}
    html.dark .sidebar{background:#151621;border-right-color:#252633}

    /* Logo 区 — Canvas 猪 + 文字 */
    .brand-row{display:flex;align-items:center;gap:10px;padding:4px 10px 12px;border-bottom:1px solid #f0f0f5}
    html.dark .brand-row{border-bottom-color:#252633}
    #pigLogo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#fce7f3,#fbcfe8);flex-shrink:0}
    html.dark #pigLogo{background:linear-gradient(135deg,#4a2d3f,#2d1f2e)}

    .chat-list{flex:1;overflow-y:auto;margin-top:8px}
    .chat-list::-webkit-scrollbar{width:4px}
    .chat-list::-webkit-scrollbar-thumb{background:rgba(236,72,153,0.25);border-radius:2px}
    .chat-item{
      padding:9px 12px;border-radius:10px;cursor:pointer;font-size:13px;color:#4b5563;
      display:flex;align-items:center;gap:8px;transition:all .18s;position:relative;
    }
    .chat-item:hover{background:#f3f4f6;color:#1f2937}
    html.dark .chat-item{color:#9ca3af}
    html.dark .chat-item:hover{background:#1d1e2c;color:#e2e8f0}
    .chat-item.active{background:linear-gradient(135deg,#fdf2f8,#fce7f3);color:#be185d;font-weight:500}
    html.dark .chat-item.active{background:rgba(236,72,153,0.12);color:#f9a8d4}
    .chat-item__del{opacity:0;width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;margin-left:auto}
    .chat-item:hover .chat-item__del{opacity:1}
    .chat-item__del:hover{background:rgba(239,68,68,0.1);color:#ef4444}

    /* ====== 主区域 ====== */
    .main-area{flex:1;height:100vh;display:flex;flex-direction:column;overflow:hidden}
    .topbar{height:56px;padding:0 24px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.7);backdrop-filter:blur(12px);position:sticky;top:0;z-index:10}
    html.dark .topbar{background:rgba(21,22,33,0.7);border-bottom-color:#252633}

    .chat-scroll::-webkit-scrollbar{width:6px}
    .chat-scroll::-webkit-scrollbar-thumb{background:rgba(236,72,153,0.25);border-radius:3px}

    /* ====== 气泡 ====== */
    .msg-user{background:linear-gradient(135deg,#ec4899,#f472b6);color:#fff;border-radius:18px 18px 4px 18px;padding:12px 16px;max-width:72%;font-size:14px;line-height:1.6;word-break:break-word;box-shadow:0 2px 8px rgba(236,72,153,0.25)}
    .msg-ai{background:#ffffff;border:1px solid #eef0f5;border-radius:18px 18px 18px 4px;padding:14px 18px;max-width:76%;font-size:14px;line-height:1.7;box-shadow:0 2px 8px rgba(0,0,0,0.04);position:relative}
    html.dark .msg-ai{background:#1a1b28;border-color:#282937}
    /* AI 消息工具栏 */
    .msg-ai__tools{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed #eef0f5;opacity:0;transition:opacity .2s}
    html.dark .msg-ai__tools{border-top-color:#2a2b38}
    .msg-wrap:hover .msg-ai__tools{opacity:1}
    .msg-tool{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;background:transparent;color:#9ca3af;transition:all .18s}
    .msg-tool:hover{background:#f3f4f6;color:#374151}
    html.dark .msg-tool{color:#6b7280}
    html.dark .msg-tool:hover{background:#282937;color:#d1d5db}
    .msg-tool svg{width:15px;height:15px}
    .msg-tool.active{color:#ec4899;background:rgba(236,72,153,0.08)}
    /* Toast 提示 */
    .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:#1f2937;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;opacity:0;transition:all .25s;z-index:200;pointer-events:none}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    .avatar{width:36px;height:36px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
    .avatar-user{background:linear-gradient(135deg,#ec4899,#f472b6);color:#fff;font-size:13px;font-weight:600}
    #pigAvatar{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#fdf2f8,#fce7f3)}
    html.dark #pigAvatar{background:linear-gradient(135deg,#4a2d3f,#2d1f2e)}

    /* ====== 联网搜索 toggle ====== */
    .web-search-toggle{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;user-select:none;transition:all .2s;border:1px solid #e5e7eb;background:#ffffff;color:#6b7280}
    .web-search-toggle:hover{border-color:#fbcfe8;color:#db2777}
    .web-search-toggle.active{background:linear-gradient(135deg,#ec4899,#f472b6);color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(236,72,153,0.3)}
    html.dark .web-search-toggle{background:#1a1b28;border-color:#282937;color:#9ca3af}

    /* ====== 按钮 ====== */
    .btn-newchat{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;border-radius:12px;background:linear-gradient(135deg,#ec4899,#f472b6);color:#fff;font-size:14px;font-weight:500;cursor:pointer;border:none;box-shadow:0 2px 8px rgba(236,72,153,0.3);transition:all .2s}
    .btn-newchat:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(236,72,153,0.4)}
    .btn-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;border:none;background:transparent;color:#6b7280}
    .btn-icon:hover{background:#f3f4f6;color:#1f2937}
    html.dark .btn-icon:hover{background:#252633;color:#e2e8f0}

    /* ====== 输入 ====== */
    .input-wrap{position:relative;border-radius:18px;border:1.5px solid #e5e7eb;background:#fff;transition:all .2s}
    .input-wrap:focus-within{border-color:#ec4899;box-shadow:0 0 0 4px rgba(236,72,153,0.12)}
    html.dark .input-wrap{background:#1a1b28;border-color:#282937}
    html.dark .input-wrap:focus-within{border-color:#ec4899;box-shadow:0 0 0 4px rgba(236,72,153,0.18)}
    .send-btn{position:absolute;right:10px;bottom:10px;width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#ec4899,#f472b6);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
    .send-btn:hover{transform:scale(1.05)}
    .send-btn.stop{background:#ef4444}

    /* ====== 空状态 ====== */
    .empty-hero{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 200px);text-align:center;padding:40px 20px}
    .empty-hero__canvas{width:96px;height:96px;border-radius:28px;background:linear-gradient(135deg,#fce7f3,#fbcfe8);margin:0 auto 24px;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 32px -8px rgba(236,72,153,0.4)}
    html.dark .empty-hero__canvas{background:linear-gradient(135deg,#4a2d3f,#2d1f2e)}
    .empty-suggestion{padding:16px 18px;border-radius:14px;border:1px solid #e5e7eb;background:#fff;cursor:pointer;transition:all .2s;text-align:left}
    .empty-suggestion:hover{border-color:#ec4899;background:#fdf2f8;transform:translateY(-1px);box-shadow:0 4px 12px rgba(236,72,153,0.1)}
    html.dark .empty-suggestion{background:#1a1b28;border-color:#282937;color:#e2e8f0}
    html.dark .empty-suggestion:hover{background:#251520;border-color:#ec4899}

    /* ====== 加载动画 ====== */
    .dot-pulse{display:inline-flex;gap:4px;padding:4px 0}
    .dot-pulse span{width:6px;height:6px;border-radius:50%;background:#ec4899;animation:dotBounce 1.2s infinite ease-in-out}
    .dot-pulse span:nth-child(2){animation-delay:.15s}
    .dot-pulse span:nth-child(3){animation-delay:.3s}
    @keyframes dotBounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-4px);opacity:1}}

    /* ====== Markdown ====== */
    .md{line-height:1.75;word-break:break-word}
    .md p{margin:0 0 8px}
    .md h1,.md h2,.md h3{margin:16px 0 8px;font-weight:600;line-height:1.3}
    .md h1{font-size:17px}.md h2{font-size:15px}.md h3{font-size:14px}
    .md ul,.md ol{margin:8px 0;padding-left:22px}
    .md li{margin:2px 0}
    .md blockquote{margin:10px 0;padding:8px 12px;border-left:3px solid #ec4899;background:rgba(236,72,153,0.08);border-radius:4px}
    .md code{background:rgba(236,72,153,0.12);color:#be185d;padding:2px 6px;border-radius:4px;font-size:13px}
    html.dark .md code{background:rgba(236,72,153,0.18);color:#f9a8d4}
    .md pre{margin:12px 0;padding:14px 16px;border-radius:10px;overflow-x:auto;background:#f6f8fa;font-size:13px;line-height:1.55}
    html.dark .md pre{background:#161b22}
    .md pre code{background:none;padding:0;color:inherit}
    .md strong{font-weight:600}
    .md a{color:#ec4899;text-decoration:underline}
    .md hr{border:none;border-top:1px solid #e5e7eb;margin:16px 0}
    html.dark .md hr{border-top-color:#282937}

    @media(max-width:768px){.sidebar{display:none}.msg-user,.msg-ai{max-width:88%}}

    /* ====== 删除确认弹窗 ====== */
    .modal-overlay{position:fixed;inset:0;background:rgba(15,16,25,0.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeIn .2s ease-out}
    .modal-overlay.hidden{display:none}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes scaleIn{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
    .modal-card{background:#ffffff;border-radius:18px;padding:28px 32px 24px;min-width:320px;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,0.2);animation:scaleIn .25s ease-out}
    html.dark .modal-card{background:#1e1f2b}
    .modal-icon{width:56px;height:56px;border-radius:16px;background:rgba(239,68,68,0.1);display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
    .modal-title{font-size:16px;font-weight:600;color:#1f2937;text-align:center;margin-bottom:8px}
    html.dark .modal-title{color:#f1f5f9}
    .modal-desc{font-size:13px;color:#6b7280;text-align:center;line-height:1.6;margin-bottom:24px}
    html.dark .modal-desc{color:#94a3b8}
    .modal-btns{display:flex;gap:10px}
    .modal-btn{flex:1;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .18s}
    .modal-cancel{background:#f3f4f6;color:#4b5563}
    .modal-cancel:hover{background:#e5e7eb}
    html.dark .modal-cancel{background:#282937;color:#d1d5db}
    html.dark .modal-cancel:hover{background:#333444}
    .modal-confirm{background:linear-gradient(135deg,#ef4444,#f87171);color:#fff}
    .modal-confirm:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(239,68,68,0.35)}
  </style>
</head>
<body>

<div class="flex h-full">
  <!-- ===== 侧边栏 ===== -->
  <aside class="sidebar">
    <!-- Brand: Canvas 小猪 -->
    <div class="brand-row">
      <img id="pigLogo" src="小猪.jpg" alt="Baomi" width="36" height="36" style="border-radius:10px;object-fit:contain;object-position:center;flex-shrink:0;background:#fff;box-shadow:0 2px 8px rgba(236,72,153,0.25);padding:2px;box-sizing:border-box">
      <div>
        <div class="font-semibold text-[15px] text-gray-800 dark:text-gray-100 leading-tight">Baomi Agent</div>
        <div class="text-[11px] text-gray-400 dark:text-gray-500">你的小猪 AI 助手</div>
      </div>
    </div>

    <button id="newChatBtn" class="btn-newchat">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      新对话
    </button>

    <div class="h-px bg-gray-200 dark:bg-gray-700/50 my-1"></div>

    <!-- 历史会话列表 -->
    <div class="chat-list" id="chatList"></div>

    <!-- 设置区 -->
    <div class="mt-auto space-y-1 pt-2 border-t border-gray-100 dark:border-gray-700/40">
      <button id="themeBtn" class="btn-icon w-full !justify-start gap-3 px-3" style="border-radius:10px">
        <svg id="iconSun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg id="iconMoon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <span id="themeLabel" class="text-[13px]">深色模式</span>
      </button>
      <div class="px-3 py-2 text-[11px] text-gray-400 dark:text-gray-500 flex items-center gap-2">
        <span class="w-1.5 h-1.5 rounded-full bg-green-500"></span>
        deepseek-v4-flash
      </div>
    </div>
  </aside>

  <!-- ===== 主区域 ===== -->
  <main class="main-area">
    <div class="topbar">
      <div class="flex items-center gap-3">
        <h2 id="chatTitle" class="text-[15px] font-semibold text-gray-800 dark:text-gray-100">新对话</h2>
      </div>
      <div class="flex items-center gap-2">
        <button id="webSearchToggle" class="web-search-toggle">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="16.61" y1="16.61" x2="21" y2="21"/></svg>
          <span id="searchLabel">联网搜索</span>
        </button>
      </div>
    </div>

    <div id="chatScroll" class="chat-scroll flex-1 overflow-y-auto">
      <div class="max-w-[820px] mx-auto px-6 py-6">
        <!-- 空状态 -->
        <div id="emptyState" class="empty-hero">
          <img id="pigHero" src="小猪.jpg" alt="Baomi" width="128" height="128" style="border-radius:32px;object-fit:contain;object-position:center;background:#fff;padding:8px;box-sizing:border-box;margin-bottom:32px">
          <h1 class="text-[26px] font-semibold text-gray-800 dark:text-gray-100 mb-3">你好呀～我是 Baomi 🐷</h1>
          <p class="text-[15px] text-gray-500 dark:text-gray-400 mb-12 max-w-md mx-auto">我可以帮你写代码、分析问题、创作内容，也能开启联网搜索获取最新信息哦！</p>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-3 max-w-[640px] mx-auto">
            <button class="empty-suggestion" data-text="帮我写一段 Python 快速排序代码并注释">
              <div class="flex items-center gap-2 mb-1.5"><span class="text-brand-500">💻</span><span class="text-[13px] font-medium">代码助手</span></div>
              <div class="text-[13px] text-gray-500 dark:text-gray-400">写一段 Python 快速排序代码并注释</div>
            </button>
            <button class="empty-suggestion" data-text="帮我总结一下 Transformer 模型的核心思想">
              <div class="flex items-center gap-2 mb-1.5"><span class="text-brand-500">💡</span><span class="text-[13px] font-medium">知识问答</span></div>
              <div class="text-[13px] text-gray-500 dark:text-gray-400">总结 Transformer 模型的核心思想</div>
            </button>
            <button class="empty-suggestion" data-text="帮我搜索 2026 年最新 AI 行业动态">
              <div class="flex items-center gap-2 mb-1.5"><span class="text-brand-500">🔎</span><span class="text-[13px] font-medium">联网搜索</span></div>
              <div class="text-[13px] text-gray-500 dark:text-gray-400">搜索 2026 年最新 AI 行业动态</div>
            </button>
            <button class="empty-suggestion" data-text="帮我写一份产品需求文档的大纲">
              <div class="flex items-center gap-2 mb-1.5"><span class="text-brand-500">📝</span><span class="text-[13px] font-medium">内容创作</span></div>
              <div class="text-[13px] text-gray-500 dark:text-gray-400">写一份产品需求文档的大纲</div>
            </button>
          </div>
        </div>

        <!-- 消息列表 -->
        <div id="messageList" class="hidden flex flex-col gap-6"></div>
      </div>
    </div>

    <!-- 输入 -->
    <div class="border-t border-gray-200 dark:border-gray-700/50 bg-white dark:bg-[#151621] py-5 px-6">
      <div class="max-w-[820px] mx-auto">
        <div id="searchStatusRow" class="hidden mb-2">
          <div class="inline-flex items-center gap-2 text-[12px] text-pink-600 dark:text-pink-300 bg-pink-50 dark:bg-pink-500/10 px-3 py-1.5 rounded-full">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="16.61" y1="16.61" x2="21" y2="21"/></svg>
            已开启联网搜索，将基于实时信息回答
          </div>
        </div>
        <div class="input-wrap">
          <textarea id="messageInput" rows="1" class="w-full bg-transparent outline-none resize-none px-4 py-3 pr-[52px] text-[14px] text-gray-800 dark:text-gray-100 placeholder:text-gray-400" style="line-height:1.55;max-height:200px" placeholder="向 Baomi Agent 发送消息...  Enter 发送 / Shift+Enter 换行"></textarea>
          <button id="sendBtn" class="send-btn" title="发送">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
        <div class="text-[11px] text-gray-400 mt-2 text-center">Baomi Agent 可能会出错，重要信息请自行核实</div>
      </div>
    </div>
  </main>
</div>

<!-- 删除确认弹窗 -->
<div id="deleteModal" class="modal-overlay hidden">
  <div class="modal-card">
    <div class="modal-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>
      </svg>
    </div>
    <div class="modal-title">确认删除？</div>
    <div class="modal-desc">该对话将被永久删除，此操作无法撤销</div>
    <div class="modal-btns">
      <button id="modalCancel" class="modal-btn modal-cancel">取消</button>
      <button id="modalConfirm" class="modal-btn modal-confirm">删除</button>
    </div>
  </div>
</div>

<script>
/* ============ 深浅模式 ============ */
const html = document.documentElement;
const iconSun = document.getElementById('iconSun');
const iconMoon = document.getElementById('iconMoon');
const themeLabel = document.getElementById('themeLabel');
function applyTheme(mode){
  if(mode==='dark'){ html.classList.add('dark'); iconSun.classList.remove('hidden'); iconMoon.classList.add('hidden'); themeLabel.textContent='浅色模式'; }
  else{ html.classList.remove('dark'); iconSun.classList.add('hidden'); iconMoon.classList.remove('hidden'); themeLabel.textContent='深色模式'; }
}
const saved = localStorage.getItem('theme')||'light';
applyTheme(saved);
document.getElementById('themeBtn').addEventListener('click', ()=>{
  const next = html.classList.contains('dark')?'light':'dark';
  applyTheme(next); localStorage.setItem('theme', next);
});

/* ============ 联网搜索 ============ */
let webSearchEnabled = false;
document.getElementById('webSearchToggle').addEventListener('click', ()=>{
  webSearchEnabled = !webSearchEnabled;
  document.getElementById('webSearchToggle').classList.toggle('active', webSearchEnabled);
  document.getElementById('searchLabel').textContent = webSearchEnabled?'已联网搜索':'联网搜索';
  document.getElementById('searchStatusRow').classList.toggle('hidden', !webSearchEnabled);
});

/* ============ 会话状态 ============ */
let currentSessionId = null;
let sessions = [];

async function api(method, url, body){
  const opts = {method, headers:{'Content-Type':'application/json'}};
  if(body!==undefined) opts.body = JSON.stringify(body);
  const r = await fetch(url, opts);
  if(!r.ok){ const e = await r.json().catch(()=>({})); throw new Error(e.error||r.statusText); }
  return r.json();
}

async function refreshSessionList(){
  try{
    const d = await api('GET','/api/sessions');
    sessions = d.sessions;
  }catch(e){ sessions=[]; }
  const list = document.getElementById('chatList');
  list.innerHTML = '';
  if(!sessions.length){
    list.innerHTML = '<div class="text-[12px] text-gray-400 text-center py-4">暂无对话</div>';
    return;
  }
  for(const s of sessions){
    const div = document.createElement('div');
    div.className = 'chat-item' + (s.id===currentSessionId?' active':'');
    div.innerHTML = `
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span class="flex-1 truncate">${s.title||'新对话'}</span>
      <span class="chat-item__del" title="删除">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </span>`;
    div.addEventListener('click', (e)=>{
      if(e.target.closest('.chat-item__del')){
        e.stopPropagation();
        showDeleteModal(s.id, s.title);
        return;
      }
      loadSession(s.id);
    });
    list.appendChild(div);
  }
}

async function newSession(){
  try{
    const d = await api('POST','/api/sessions',{title:'新对话'});
    currentSessionId = d.id;
  }catch(e){ currentSessionId = crypto.randomUUID().slice(0,12); }
  document.getElementById('chatTitle').textContent = '新对话';
  document.getElementById('emptyState').classList.remove('hidden');
  document.getElementById('messageList').classList.add('hidden');
  document.getElementById('messageList').innerHTML = '';
  refreshSessionList();
}

async function loadSession(sid){
  const sess = await api('GET',`/api/sessions/${sid}`);
  currentSessionId = sid;
  document.getElementById('chatTitle').textContent = sess.title||'新对话';
  refreshSessionList();
  // 渲染
  const ml = document.getElementById('messageList');
  ml.innerHTML = '';
  const msgs = sess.messages.filter(m=>m.role!=='system');
  if(!msgs.length){
    document.getElementById('emptyState').classList.remove('hidden');
    ml.classList.add('hidden');
    return;
  }
  document.getElementById('emptyState').classList.add('hidden');
  ml.classList.remove('hidden');
  let i=0;
  while(i<msgs.length){
    if(msgs[i].role==='user'){
      renderUserBubble(msgs[i].content);
      i++;
    }else if(msgs[i].role==='assistant'){
      renderAiBubble(msgs[i].content);
      i++;
    }else i++;
  }
  document.getElementById('chatScroll').scrollTop = document.getElementById('chatScroll').scrollHeight;
}

/* ============ Markdown ============ */
function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }
function renderMarkdown(md){
  const blocks=[];
  md=md.replace(/```(\w*)\n([\s\S]*?)```/g,(m,lang,code)=>{const i=blocks.length;blocks.push(`<pre><code${lang?` class="language-${lang}"`:''}>${escapeHtml(code.trim())}</code></pre>`);return`\u0000C${i}\u0000`;});
  md=md.replace(/`([^`]+)`/g,(_,c)=>`<code>${escapeHtml(c)}</code>`);
  md=md.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  md=md.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const lines=md.split('\n'); const out=[]; let inList=null,buf=[];
  function flush(){if(inList&&buf.length){out.push(`<${inList}>${buf.join('')}</${inList}>`);buf=[];inList=null;}}
  for(let line of lines){
    if(line.startsWith('\u0000C')){flush();out.push(blocks[parseInt(line.match(/\u0000C(\d+)\u0000/)[1])]);continue;}
    if(line.trim()===''){flush();continue;}
    const h=line.match(/^(#{1,6})\s+(.+)$/);
    if(h){flush();out.push(`<h${h[1].length}>${h[2]}</h${h[1].length}>`);continue;}
    if(line.startsWith('> ')){flush();out.push(`<blockquote>${line.slice(2)}</blockquote>`);continue;}
    if(/^[-*]\s+/.test(line)){if(inList!=='ul')flush();inList='ul';buf.push(`<li>${line.replace(/^[-*]\s+/,'')}</li>`);continue;}
    if(/^\d+\.\s+/.test(line)){if(inList!=='ol')flush();inList='ol';buf.push(`<li>${line.replace(/^\d+\.\s+/,'')}</li>`);continue;}
    flush();out.push(`<p>${line}</p>`);
  }
  flush();return out.join('\n');
}

/* ============ 渲染 ============ */
const chatScroll = document.getElementById('chatScroll');
function scrollToBottom(){ chatScroll.scrollTop = chatScroll.scrollHeight; }
function hideEmpty(){ document.getElementById('emptyState').classList.add('hidden'); document.getElementById('messageList').classList.remove('hidden'); }
function showEmpty(){ document.getElementById('emptyState').classList.remove('hidden'); document.getElementById('messageList').classList.add('hidden'); document.getElementById('messageList').innerHTML=''; }

function renderUserBubble(text){
  const ml = document.getElementById('messageList');
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap flex gap-3 justify-end';
  wrap.innerHTML = `<div class="msg-user">${escapeHtml(text)}</div><div class="avatar avatar-user">我</div>`;
  ml.appendChild(wrap); scrollToBottom();
}
function renderAiLoading(){
  const ml = document.getElementById('messageList');
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap flex gap-3';
  wrap.innerHTML = `<img src="小猪.jpg" class="avatar" style="width:36px;height:36px;border-radius:10px;object-fit:contain;object-position:center;background:#fff;padding:2px;box-sizing:border-box"><div class="msg-ai"><div class="dot-pulse"><span></span><span></span><span></span></div></div>`;
  ml.appendChild(wrap); scrollToBottom();
  return wrap;
}
function renderAiBubble(text){
  const ml = document.getElementById('messageList');
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap flex gap-3';
  wrap.innerHTML = `<img src="小猪.jpg" class="avatar" style="width:36px;height:36px;border-radius:10px;object-fit:contain;object-position:center;background:#fff;padding:2px;box-sizing:border-box"><div class="msg-ai md">${renderMarkdown(text)}</div>`;
  // 历史消息也加工具栏
  setTimeout(()=>bindTools(wrap, text), 0);
  ml.appendChild(wrap); scrollToBottom();
}
/* ============ AI 消息工具栏图标（内联 SVG） ============ */
const TOOL_SVG = {
  copy:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`,
  retry:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>`,
  share:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>`,
  like:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>`,
  dislike: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm5-22h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"/></svg>`,
  check:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
};

/* ============ Toast 提示 ============ */
let toastTimer=null;
function showToast(msg){
  let t=document.getElementById('__toast');
  if(!t){ t=document.createElement('div'); t.id='__toast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1500);
}

/* ============ 重试时记录用户最后一条消息 ============ */
let _retryUserMsg = null;

/* ============ 工具栏绑定（抽成公共函数） ============ */
function bindTools(wrap, rawText){
  const plainText = rawText.replace(/```[\s\S]*?```/g, m=>m.replace(/```\w*\n?/g,'').replace(/```/g,'')).replace(/`([^`]+)`/g,'$1').replace(/[#*_>~\-]/g,'').trim();
  const isError = rawText.startsWith('❌');
  if(isError) return;
  const aiDiv = wrap.querySelector('.msg-ai');
  if(!aiDiv || aiDiv.querySelector('.msg-ai__tools')) return;
  const toolsHtml = `
    <div class="msg-ai__tools">
      <button class="msg-tool" title="复制" data-tool="copy">${TOOL_SVG.copy}</button>
      <button class="msg-tool" title="重新生成" data-tool="retry">${TOOL_SVG.retry}</button>
      <button class="msg-tool" title="分享" data-tool="share">${TOOL_SVG.share}</button>
      <button class="msg-tool" title="点赞" data-tool="like">${TOOL_SVG.like}</button>
      <button class="msg-tool" title="点踩" data-tool="dislike">${TOOL_SVG.dislike}</button>
    </div>`;
  aiDiv.insertAdjacentHTML('beforeend', toolsHtml);
  wrap.querySelectorAll('.msg-tool').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const t = btn.dataset.tool;
      if(t==='copy'){
        navigator.clipboard.writeText(plainText).then(()=>{
          btn.innerHTML = TOOL_SVG.check;
          showToast('已复制到剪贴板');
          setTimeout(()=>btn.innerHTML=TOOL_SVG.copy, 1500);
        }).catch(()=>showToast('复制失败'));
      }else if(t==='retry'){
        if(_retryUserMsg && !isGenerating){
          wrap.remove();
          sendMessage(_retryUserMsg);
        }else if(isGenerating){
          showToast('正在生成中...');
        }else{
          showToast('无法重试');
        }
      }else if(t==='share'){
        const url = location.href + (location.search?'':'?s='+Date.now());
        navigator.clipboard.writeText(url).then(()=>showToast('链接已复制'));
      }else if(t==='like' || t==='dislike'){
        btn.classList.toggle('active');
        showToast(t==='like'?'感谢反馈 ❤️':'收到，我会改进');
      }
    });
  });
}

function replaceWithReply(wrap, text){
  wrap.innerHTML = `<img src="小猪.jpg" class="avatar" style="width:36px;height:36px;border-radius:10px;object-fit:contain;object-position:center;background:#fff;padding:2px;box-sizing:border-box"><div class="msg-ai md">${renderMarkdown(text)}</div>`;
  bindTools(wrap, text);
  scrollToBottom();
}

/* ============ 发送 ============ */
let isGenerating = false, abortController = null;
const messageInput = document.getElementById('messageInput');
const sendBtn = document.getElementById('sendBtn');

messageInput.addEventListener('input', ()=>{
  messageInput.style.height='auto';
  messageInput.style.height = Math.min(messageInput.scrollHeight,200)+'px';
});

async function sendMessage(text){
  if(!text.trim()||isGenerating) return;
  if(!currentSessionId){ await newSession(); }
  _retryUserMsg = text.trim();  // 记录，供重试使用
  hideEmpty();
  renderUserBubble(text.trim());
  messageInput.value=''; messageInput.style.height='auto';

  isGenerating=true;
  sendBtn.classList.add('stop');
  sendBtn.innerHTML=`<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>`;
  abortController = new AbortController();
  const loadingWrap = renderAiLoading();

  try{
    const res = await fetch('/api/chat',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({session_id:currentSessionId, message:text.trim(), web_search:webSearchEnabled}),
      signal:abortController.signal,
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error||`HTTP ${res.status}`);
    replaceWithReply(loadingWrap, data.reply);
    if(data.title && data.title!=='新对话') document.getElementById('chatTitle').textContent = data.title;
    refreshSessionList();
  }catch(err){
    if(err.name!=='AbortError') replaceWithReply(loadingWrap, `❌ ${err.message}`);
    else loadingWrap.remove();
  }finally{
    isGenerating=false; abortController=null;
    sendBtn.classList.remove('stop');
    sendBtn.innerHTML=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>`;
  }
}

sendBtn.addEventListener('click', ()=>{
  if(isGenerating){ abortController && abortController.abort(); return; }
  sendMessage(messageInput.value);
});
messageInput.addEventListener('keydown', (e)=>{
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendMessage(messageInput.value); }
});
document.getElementById('newChatBtn').addEventListener('click', newSession);
document.querySelectorAll('.empty-suggestion').forEach(btn=>{
  btn.addEventListener('click', ()=>sendMessage(btn.dataset.text));
});

// ============ 删除确认弹窗 ============
let pendingDeleteId = null;
function showDeleteModal(id, title){
  pendingDeleteId = id;
  document.getElementById('deleteModal').classList.remove('hidden');
}
function hideDeleteModal(){
  document.getElementById('deleteModal').classList.add('hidden');
  pendingDeleteId = null;
}
document.getElementById('modalCancel').addEventListener('click', hideDeleteModal);
document.getElementById('modalConfirm').addEventListener('click', async ()=>{
  if(!pendingDeleteId) return;
  await api('DELETE', `/api/sessions/${pendingDeleteId}`);
  if(pendingDeleteId === currentSessionId) await newSession();
  else await refreshSessionList();
  hideDeleteModal();
});
document.getElementById('deleteModal').addEventListener('click', (e)=>{
  if(e.target.id === 'deleteModal') hideDeleteModal();
});
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape') hideDeleteModal();
});

// 首次加载 —— 加载最新会话，没有才新建
(async ()=>{
  await refreshSessionList();
  if(sessions.length>0){
    await loadSession(sessions[0].id);
  }else{
    await newSession();
  }
})();
</script>
